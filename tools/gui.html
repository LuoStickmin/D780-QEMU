<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D780 Boot Monitor</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --fg: #e6edf3; --dim: #8b949e; --ok: #3fb950; --bad: #f85149;
    --accent: #58a6ff; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--bad); }
  .muted { color: var(--dim); }
  .grid {
    display: grid; gap: 12px; margin-top: 18px;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
  }
  .card .k { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .card .v { font-size: 24px; margin-top: 4px; }
  .card .v.small { font-size: 16px; word-break: break-all; }
  .row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  button {
    background: #21262d; color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 16px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button.danger { background: #b62324; border-color: #b62324; }
  .cols { display: grid; gap: 12px; margin-top: 18px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--dim); font-weight: 600; letter-spacing: .6px; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow: auto; font-size: 12px; }
  .pcs span { display: inline-block; margin: 2px 6px 2px 0; color: var(--accent); }
  .stage { color: var(--warn); }
  footer { margin-top: 18px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>D780 Boot Monitor</h1>
  <span><span id="dot" class="dot off"></span> <span id="state" class="muted">stopped</span></span>
  <span class="muted" id="elapsed"></span>
  <span class="muted" id="rundir"></span>
</header>

<div class="grid">
  <div class="card"><div class="k">stage</div><div class="v small stage" id="stage">not started</div></div>
  <div class="card"><div class="k">last pc</div><div class="v small" id="lastpc">-</div></div>
  <div class="card"><div class="k">svc</div><div class="v" id="svc">0</div></div>
  <div class="card"><div class="k">undef / prefetch / data</div><div class="v small" id="aborts">0 / 0 / 0</div></div>
  <div class="card"><div class="k">probe events</div><div class="v small" id="probe">0</div></div>
  <div class="card"><div class="k">translated blocks</div><div class="v" id="tb">0</div></div>
</div>

<div class="row">
  <button class="primary" onclick="post('/api/start')">Start</button>
  <button onclick="post('/api/restart')">Restart</button>
  <button class="danger" onclick="post('/api/stop')">Stop</button>
</div>

<div class="cols">
  <div class="panel">
    <h2>PC TRAIL</h2>
    <div class="pcs" id="pcs"><span>-</span></div>
    <h2 style="margin-top:14px">STATUS</h2>
    <pre id="note" class="muted">waiting for start…</pre>
  </div>
  <div class="panel">
    <h2>QEMU LOG (tail)</h2>
    <pre id="log">-</pre>
  </div>
</div>

<footer>
  D780-QEMU · nikon-d780 · <span id="cpu"></span> · <span id="smp"></span> CPUs ·
  <span id="payload"></span>
</footer>

<script>
let failures = 0;

async function post(url) {
  try {
    const r = await fetch(url, {method: 'POST'});
    const j = await r.json();
    if (!j.ok) { document.getElementById('note').textContent = j.error || 'error'; }
  } catch (e) { /* ignore */ }
  refresh();
}

function fmtAborts(s) { return s.undef + ' / ' + s.prefetch + ' / ' + s.data; }

async function refresh() {
  try {
    const r = await fetch('/api/status', {cache: 'no-store'});
    const s = await r.json();
    failures = 0;
    document.getElementById('dot').className = 'dot ' + (s.running ? 'on' : 'off');
    document.getElementById('state').textContent = s.running ? 'running' : 'stopped';
    document.getElementById('elapsed').textContent = s.elapsed ? s.elapsed + ' s' : '';
    document.getElementById('rundir').textContent = s.run_dir || '';
    document.getElementById('stage').textContent = s.stage;
    document.getElementById('lastpc').textContent = s.last_pc || '-';
    document.getElementById('svc').textContent = s.svc;
    document.getElementById('aborts').textContent = fmtAborts(s);
    document.getElementById('probe').textContent = s.probe +
      (s.last_probe ? ' @ 0x' + s.last_probe : '');
    document.getElementById('tb').textContent = s.tb;
    document.getElementById('pcs').innerHTML = (s.pcs.length ? s.pcs : ['-'])
      .map(p => '<span>' + p + '</span>').join('');
    document.getElementById('log').textContent = (s.log || []).join('\n') || '-';
    document.getElementById('note').textContent = s.error ||
      (s.pid ? 'pid ' + s.pid : 'not running');
    document.getElementById('cpu').textContent = s.cpu || 'cortex-a15';
    document.getElementById('smp').textContent = s.smp || 2;
    document.getElementById('payload').textContent = s.payload || 'eg1510';
  } catch (e) {
    failures++;
    document.getElementById('note').textContent = 'server unreachable (' + failures + ')';
  }
}

async function init() {
  refresh();
  setInterval(refresh, 1000);
}
init();
</script>
</body>
</html>
